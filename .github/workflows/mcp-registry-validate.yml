name: Validate SuperCheap Registry manifest without authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-mcp-registry-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'hardtab/supercheap-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate using the pinned publisher and trusted system CA bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/mcp-registry-validate-v1.8.1-linux-amd64.tar.gz"
          stage="$RUNNER_TEMP/mcp-registry-validate-stage"
          runner_ca_bundle="/etc/ssl/certs/ca-certificates.crt"
          trap 'rm -rf -- "$stage" "$archive"' EXIT
          if [[ ! -r "$runner_ca_bundle" || ! -s "$runner_ca_bundle" ]]; then
            echo "::error::Hosted runner system CA bundle is missing, unreadable, or empty."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            "$archive" | sha256sum --check --status
          mkdir -m 755 "$stage"
          mkdir -m 700 "$stage/.config"
          tar -xzf "$archive" -C "$stage" mcp-publisher
          chmod 555 "$stage/mcp-publisher"
          install -m 444 "$GITHUB_WORKSPACE/server.json" "$stage/server.json"
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /root/.config:rw,nosuid,nodev,noexec,size=1m,mode=700 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --workdir /tmp \
            --mount "type=bind,src=$stage,dst=/root,readonly" \
            --mount "type=bind,src=$runner_ca_bundle,dst=/etc/ssl/certs/ca-certificates.crt,readonly" \
            --env SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            --entrypoint /bin/sh \
            node:24.21.0-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7 \
            -c 'set -eu; /root/mcp-publisher validate /root/server.json'
